name: build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        shell: pwsh
        run: |
          $m = Select-String -Path CMakeLists.txt -Pattern 'project\(KaradagBeat VERSION ([0-9.]+)'
          $v = $m.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Tag $env:GITHUB_REF_NAME doesn't match the version in CMakeLists.txt (v$v)"
          }
          "value=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build tests
        run: cmake --build build --config Release --target DspTest StateTest --parallel | Tee-Object build-tests.log

      - name: DSP tests
        run: build\DspTest_artefacts\Release\DspTest.exe | Tee-Object tests-dsp.log

      - name: State tests
        run: build\StateTest_artefacts\Release\StateTest.exe | Tee-Object tests-state.log

      - name: Build plugin
        run: cmake --build build --config Release --target KaradagBeat_VST3 KaradagBeat_Standalone --parallel | Tee-Object build-plugin.log

      - name: pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          New-Item -ItemType Directory -Force pluginval-log | Out-Null
          $plugin = Resolve-Path "build\KaradagBeat_artefacts\Release\VST3\Karadag Beat.vst3"
          $p = Start-Process -FilePath .\pluginval\pluginval.exe -Wait -PassThru -NoNewWindow `
                 -RedirectStandardOutput pluginval-log\pluginval.txt `
                 -ArgumentList @("--strictness-level", "10", "--validate-in-process",
                                 "--timeout-ms", "600000", "`"$plugin`"")
          Get-Content pluginval-log\pluginval.txt
          if ($p.ExitCode -ne 0) { throw "pluginval failed (exit code $($p.ExitCode))" }

      - name: Installer
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile innosetup.exe
          Start-Process .\innosetup.exe -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/SP-"
          & "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.value }}" installer\KaradagBeat.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: VST3 zip
        shell: pwsh
        run: Compress-Archive -Path "build\KaradagBeat_artefacts\Release\VST3\Karadag Beat.vst3" -DestinationPath "KaradagBeat-${{ steps.version.outputs.value }}-Windows-VST3.zip"

      - name: Report errors
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Include *.log, pluginval.txt -Recurse -ErrorAction SilentlyContinue |
            Select-String -Pattern "error C|error LNK|: error|CMake Error|\[FAIL\]|FAILED|!!!" |
            Select-Object -First 10 | ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }

      - uses: actions/upload-artifact@v4
        with:
          name: KaradagBeat-windows
          path: |
            build/installer/*.exe
            KaradagBeat-*-VST3.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pluginval-log-windows
          path: pluginval-log
          if-no-files-found: ignore

  macos:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          v=$(sed -nE 's/^project\(KaradagBeat VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "Version $v"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure.log

      - name: Build tests
        run: cmake --build build --target DspTest StateTest --parallel 2>&1 | tee build-tests.log

      - name: DSP tests
        run: ./build/DspTest_artefacts/Release/DspTest | tee tests-dsp.log

      - name: State tests
        run: ./build/StateTest_artefacts/Release/StateTest | tee tests-state.log

      - name: Build plugin
        run: cmake --build build --target KaradagBeat_VST3 KaradagBeat_AU KaradagBeat_Standalone --parallel 2>&1 | tee build-plugin.log

      - name: Package
        run: bash installer/macos/package.sh "${{ steps.version.outputs.value }}" 2>&1 | tee package.log

      - name: Install package and validate
        run: |
          sudo installer -pkg "build/installer/KaradagBeat-${{ steps.version.outputs.value }}-macOS.pkg" -target / | tee install.log
          test -d "/Library/Audio/Plug-Ins/VST3/Karadag Beat.vst3"
          test -d "/Library/Audio/Plug-Ins/Components/Karadag Beat.component"
          test -d "/Applications/Karadag Beat.app"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aumf Kbt1 Krdg | tee auval.log
          grep -q "AU VALIDATION SUCCEEDED" auval.log
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --timeout-ms 600000 \
            "/Library/Audio/Plug-Ins/VST3/Karadag Beat.vst3" | tee pluginval-vst3.log
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --timeout-ms 600000 \
            "/Library/Audio/Plug-Ins/Components/Karadag Beat.component" | tee pluginval-au.log

      - name: Report errors
        if: failure()
        run: |
          grep -hE "error:|CMake Error|\[FAIL\]|FAILED|!!!|FATAL|ERROR|installer:" *.log 2>/dev/null | head -10 |
            while IFS= read -r line; do echo "::error::$line"; done || true

      - uses: actions/upload-artifact@v4
        with:
          name: KaradagBeat-macos
          path: build/installer/*.pkg

  release:
    if: github.ref_type == 'tag'
    needs: [ windows, macos ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: KaradagBeat-*
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find dist -type f -name 'KaradagBeat-*')
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 3
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --title "Karadag Beat ${GITHUB_REF_NAME#v}" --notes-file installer/release-notes.md
